name: Build installers

# Manual runs (workflow_dispatch) build + upload the Windows installer artifact
# for debugging without publishing anything. Pushing a version tag (v*)
# additionally creates a DRAFT GitHub Release with the Windows installer.
#
# macOS is NOT built here: GitHub's macos-13 (Intel) runners are effectively
# unschedulable (runs sit queued for hours, then cancel), so the .dmg is built
# locally on an Intel Mac with packaging/build_macos.sh and attached to the
# draft release by hand (gh release upload <tag> Kaiwa-macos.dmg).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for a manual build"
        required: false
        default: "0.0.0-dev"
      publish_to_tag:
        description: "If set, upload the built installer to this existing release tag"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40  # fail fast instead of hanging to the 24h ceiling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow
      - name: Generate .ico icon
        run: python -c "from PIL import Image; im=Image.open('packaging/kaiwa-icon-1024.png').convert('RGBA'); im.save('packaging/kaiwa.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"
      - name: Fetch bundled resources (JMdict + whisper model)
        run: |
          python packaging/fetch_jmdict.py
          python packaging/fetch_whisper_model.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Bundle whisper.cpp (speech-to-text)
        continue-on-error: true   # never fail the installer over the STT binary
        run: python packaging/fetch_whisper_win.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build app
        run: pyinstaller packaging/kaiwa.spec --noconfirm
      - name: Bundle VOICEVOX (best-effort, ~1.7 GB; copied post-build)
        continue-on-error: true
        shell: pwsh
        run: |
          python packaging/fetch_voicevox_win.py
          if (Test-Path vendor\voicevox) {
            Copy-Item -Recurse -Force vendor\voicevox dist\Kaiwa\_internal\vendor\voicevox
            Write-Host "VOICEVOX bundled into the Windows app"
          }
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $env:KAIWA_VERSION = $env:GITHUB_REF_NAME -replace '^v',''
          } else {
            $env:KAIWA_VERSION = '${{ github.event.inputs.version }}'
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\kaiwa.iss
      - uses: actions/upload-artifact@v4
        with:
          name: kaiwa-windows-exe
          path: dist_installer/Kaiwa-Setup.exe
      - name: Attach installer to an existing release (optional)
        if: ${{ inputs.publish_to_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.publish_to_tag }}" dist_installer/Kaiwa-Setup.exe --clobber --repo ${{ github.repository }}

  release:
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          append_body: true
          body: |
            > **macOS build:** not produced by CI (the macos-13 Intel runner is
            > effectively unschedulable). Build it locally on an Intel Mac with
            > `packaging/build_macos.sh`, then attach it before publishing:
            > `gh release upload ${{ github.ref_name }} Kaiwa-macos.dmg`
          files: |
            artifacts/kaiwa-windows-exe/Kaiwa-Setup.exe
